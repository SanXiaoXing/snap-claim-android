name: snap_claim_android
description: "A new Flutter project."
# 以下代码行防止该包被意外发布到 pub.dev。
publish_to: 'none'

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

version: 2.0.0+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 二维码 / 条形码扫描（相机实时扫描 + 相册图片识别）。
  mobile_scanner: ^7.4.0
  # 相册选图（配合 mobile_scanner.analyzeImage 识别本地图片中的二维码）。
  image_picker: ^1.1.2
  snap_claim_core:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  google_mlkit_text_recognition: ^0.16.0
  # 本地 SQLite 持久化（报销单 + 明细）。
  sqflite: ^2.4.1
  # 访问缓存目录（清除缓存功能）。
  path_provider: ^2.1.5
  # 调起系统分享面板（分享报销单图片 / 文本）。
  share_plus: ^10.1.4
  # 本地键值存储（持久化主题模式等偏好设置）。
  shared_preferences: ^2.5.3
  file_picker: 10.3.10
  url_launcher: ^6.3.2
  # AI 情况说明：访问智谱 OpenAI 兼容 chat/completions（SSE 流式）。
  http: ^1.2.2
  # 长按应用图标动态快捷方式（桌面入口 #8）。
  quick_actions: ^1.1.1
  # 桌面小组件基座（桌面入口 #9/#10）：金额卡 / 快捷操作卡。
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:

  uses-material-design: true

  assets:
    - assets/icon/logo.webp

